<section class="metric-section">
  <header class="metric-section__header">
    <div class="metric-section__meta">
      <span class="metric-section__eyebrow">Vazão do time</span>
      <h2 class="metric-section__title">Throughput</h2>
    </div>

    @if (totalDeliveries > 0) {
      <div class="throughput-stat">
        <span class="throughput-stat__value">{{ totalDeliveries }}</span>
        <span class="throughput-stat__label">{{ totalDeliveries === 1 ? 'entrega' : 'entregas' }} no período</span>
      </div>
    }
  </header>

  @if (weeks.length > 0) {
    <div class="metric-section__chart-wrap">
      <canvas baseChart
        [type]="'bar'"
        [data]="chartData"
        [options]="chartOptions">
      </canvas>
    </div>
  } @else {
    <div class="metric-section__empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="10" width="4" height="11" rx="1" stroke="currentColor" stroke-width="1.25"/>
        <rect x="10" y="6" width="4" height="15" rx="1" stroke="currentColor" stroke-width="1.25"/>
        <rect x="17" y="14" width="4" height="7" rx="1" stroke="currentColor" stroke-width="1.25"/>
      </svg>
      <p>Nenhuma entrega no período</p>
    </div>
  }
</section>
