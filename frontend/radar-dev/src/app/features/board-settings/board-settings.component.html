<div class="settings-container">
  <h1>Configuração do Board</h1>

  <div *ngIf="staleWarning" class="warning-banner">
    As colunas do board foram alteradas. Reconfigure as métricas.
  </div>

  <div *ngIf="loading" class="loading">Carregando colunas do board...</div>

  <div *ngIf="loadError" class="error-state">
    <p>Não foi possível carregar as colunas do board.</p>
    <button (click)="loadBoard()">Tentar novamente</button>
  </div>

  <form *ngIf="!loading && !loadError && board" (ngSubmit)="onSave()">
    <section class="form-section">
      <h2>Colunas do fluxo</h2>

      <div class="form-field">
        <label for="startColumn">Coluna de início</label>
        <select id="startColumn" [(ngModel)]="startColumn" name="startColumn">
          <option value="">Selecione...</option>
          <option *ngFor="let col of board.columns" [value]="col.name">{{ col.name }}</option>
        </select>
      </div>

      <div class="form-field">
        <label for="endColumn">Coluna de fim</label>
        <select id="endColumn" [(ngModel)]="endColumn" name="endColumn">
          <option value="">Selecione...</option>
          <option *ngFor="let col of availableEndColumns" [value]="col.name">{{ col.name }}</option>
        </select>
      </div>
    </section>

    <section class="form-section" *ngIf="board.lanes.length > 0">
      <h2>Lanes</h2>
      <div *ngFor="let lane of board.lanes" class="checkbox-field">
        <label>
          <input
            type="checkbox"
            [checked]="isLaneSelected(lane)"
            (change)="toggleLane(lane)"
          />
          {{ lane }}
        </label>
      </div>
    </section>

    <p *ngIf="validationError" class="validation-error">{{ validationError }}</p>

    <button type="submit" class="save-button">Salvar configuração</button>
  </form>
</div>
