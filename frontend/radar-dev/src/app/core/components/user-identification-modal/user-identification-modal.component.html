<div class="welcome-overlay">
  <div class="welcome-card">
    <div class="welcome-mark">
      <svg width="32" height="32" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="1.75" fill="currentColor"/>
        <line x1="11" y1="1" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="17.5" x2="11" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1" y1="11" x2="4.5" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17.5" y1="11" x2="21" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="welcome-header">
      <h1 class="welcome-title">Bem-vindo ao RadarDev</h1>
      <p class="welcome-subtitle">Acompanhe o fluxo do seu board Azure DevOps em tempo real.</p>
    </div>

    <div class="welcome-form">
      <label class="field-label" for="userName">Como posso te chamar?</label>
      <input
        id="userName"
        class="field-input"
        type="text"
        [(ngModel)]="userName"
        placeholder="Seu nome"
        (keyup.enter)="confirm()"
        autofocus
      />
    </div>

    <button class="btn-primary" (click)="confirm()" [disabled]="!userName.trim()">
      Entrar no dashboard
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
